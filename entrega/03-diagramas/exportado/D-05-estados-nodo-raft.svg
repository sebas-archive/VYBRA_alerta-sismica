00000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="63.2461" x="643.23" y="355.6855">rol = Lider</text></g><g id="CAIDO"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#244B5A;stroke-width:0.5;" width="121.7305" x="1023.82" y="212.5781"/><line style="stroke:#244B5A;stroke-width:0.5;" x1="1023.82" x2="1145.5505" y1="250.5156" y2="250.5156"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="101.7305" x="1033.82" y="228.7168">Ca&#237;do (simulado)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="80.5547" x="1033.82" y="242.6855">caido_ = true</text></g><ellipse cx="154.5" cy="266.5781" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="29" data-uid="ent0003" id="entity_GMN2"><path d="M29.27,311.6681 L29.27,405.4806 L279.7407,405.4806 L279.7407,321.6681 L269.7407,311.6681 L29.27,311.6681" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M269.7407,311.6681 L269.7407,321.6681 L279.7407,321.6681 L269.7407,311.6681" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="189.0938" x="35.27" y="327.8068">Situaci&#243;n publicada en /estado:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="216.1113" x="35.27" y="341.7755">funcionando, sincronizando o caido.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="217.7988" x="35.27" y="355.7443">- sincronizando: sin l&#237;der, candidato,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="221.8418" x="42.8989" y="369.713">seguidor detr&#225;s del commit del l&#237;der,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="206.7832" x="42.8989" y="383.6818">o l&#237;der con entradas sin confirmar.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="92.2266" x="35.27" y="397.6505">(api.cpp:27-32)</text></g><g class="entity" data-entity="GMN5" data-source-line="38" data-uid="ent0006" id="entity_GMN5"><path d="M518.74,410.6381 L518.74,476.5131 L830.9627,476.5131 L830.9627,420.6381 L820.9627,410.6381 L518.74,410.6381" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M820.9627,410.6381 L820.9627,420.6381 L830.9627,420.6381 L820.9627,410.6381" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="264.7383" x="524.74" y="426.7768">Al postularse: termino++ y votadoPor = yo,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="287.3379" x="524.74" y="440.7455">guardado en NVS ANTES de pedir votos; el voto</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="291.2227" x="524.74" y="454.7143">propio cuenta (1 de 2). Sin mayor&#237;a se repostula</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="219.9492" x="524.74" y="468.683">con un nuevo plazo. (raft.cpp:52-70)</text></g><g class="entity" data-entity="GMN8" data-source-line="45" data-uid="ent0009" id="entity_GMN8"><path d="M945.71,310.6581 L945.71,346.5781 L716.82,350.5781 L945.71,354.5781 L945.71,390.5019 A0,0 0 0 0 945.71,390.5019 L1223.6553,390.5019 A0,0 0 0 0 1223.6553,390.5019 L1223.6553,320.6581 L1213.6553,310.6581 L945.71,310.6581 A0,0 0 0 0 945.71,310.6581" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1213.6553,310.6581 L1213.6553,320.6581 L1223.6553,320.6581 L1213.6553,310.6581" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="256.9453" x="951.71" y="326.7968">Al ganar: crea la entrada InicioTermino del</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="256.4707" x="951.71" y="340.7655">t&#233;rmino nuevo, inicializa nextIdx/matchIdx</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="251.1152" x="951.71" y="354.7343">y env&#237;a latidos. Cada 500 ms (300 ms por</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="228.9668" x="951.71" y="368.703">defecto en nodo-sim) late y reenv&#237;a lo</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="254.9707" x="951.71" y="382.6718">no confirmado. (raft.cpp:72-103, 313-325)</text></g><g class="entity" data-entity="GMN11" data-source-line="53" data-uid="ent0012" id="entity_GMN11"><path d="M918.96,425.6581 L918.96,505.5019 L1250.4073,505.5019 L1250.4073,435.6581 L1240.4073,425.6581 L918.96,425.6581" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1240.4073,425.6581 L1240.4073,435.6581 L1250.4073,435.6581 L1240.4073,425.6581" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="285.2988" x="924.96" y="441.7968">Ca&#237;da l&#243;gica del software: no corta la corriente.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="310.4473" x="924.96" y="455.7655">En Docker se para el contenedor nodoN; con ESP32</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="248.4375" x="924.96" y="469.7343">f&#237;sicos, el panel env&#237;a POST /control caer.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="289.1602" x="924.96" y="483.703">Mientras est&#225; ca&#237;do, recibir() y tick() se ignoran.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="277.248" x="924.96" y="497.6718">No hay pre-vote ni check-quorum (limitaci&#243;n).</text></g><!--link *start* to SEG--><g class="link" data-entity-1=".start." data-entity-2="SEG" data-source-line="18" data-uid="lnk3" id="link_.start._SEG"><path d="M154.5,256.1881 C154.5,244.6981 154.5,239.2081 154.5,227.7281" fill="none" id="*start*-to-SEG" style="stroke:#244B5A;stroke-width:1;"/><polygon fill="#244B5A" points="154.5,221.7281,150.5,230.7281,154.5,226.7281,158.5,230.7281,154.5,221.7281" style="stroke:#244B5A;stroke-width:1;"/></g><!--link SEG to CAND--><g class="link" data-entity-1="SEG" data-entity-2="CAND" data-source-line="19" data-uid="lnk4" id="link_SEG_CAND"><path d="M208.06,202.1481 C306.12,212.5581 510.2035,234.2153 611.2735,244.9353" fill="none" id="SEG-to-CAND" style="stroke:#244B5A;stroke-width:1;"/><polygon fill="#244B5A" points="617.24,245.5681,608.7121,240.6412,612.2679,245.0408,607.8683,248.5966,617.24,245.5681" style="stroke:#244B5A;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="177.627" x="310.74" y="211.5068">vence timeout 5000-9000 ms</text></g><!--reverse link SEG to CAND--><g class="link" data-entity-1="SEG" data-entity-2="CAND" data-source-line="21" data-uid="lnk7" id="link_SEG_CAND"><path d="M213.7865,214.4318 C236.1365,221.6918 256.62,228.9381 279.74,238.5781 C293.5,244.3081 295.23,250.1481 309.74,253.5781 C416.02,278.6681 544.67,268.9881 617.1,260.0281" fill="none" id="SEG-backto-CAND" style="stroke:#244B5A;stroke-width:1;"/><polygon fill="#244B5A" points="208.08,212.5781,215.404,219.1629,212.8354,214.1228,217.8755,211.5543,208.08,212.5781" style="stroke:#244B5A;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" te