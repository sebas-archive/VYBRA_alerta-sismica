<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="439.5835px" preserveAspectRatio="none" style="width:1100px;height:439px;background:#FFFFFF;" version="1.1" viewBox="0 0 1100 439" width="1100.4643px" zoomAndPan="magnify"><title>D-11 &#183; M&#225;quina de estados s&#237;smica y niveles de alerta
Sismo::aplicar() sobre entradas confirmadas</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="'DejaVu Sans'" font-size="12.7961" font-weight="bold" lengthAdjust="spacing" textLength="388.6127" x="350.801" y="19.4047">D-11 &#183; M&#225;quina de estados s&#237;smica y niveles de alerta</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12.7961" font-weight="bold" lengthAdjust="spacing" textLength="321.6831" x="384.2658" y="34.3002">Sismo::aplicar() sobre entradas confirmadas</text></g><g id="REPOSO"><rect fill="#F1F1F1" height="37.6356" rx="9.4089" ry="9.4089" style="stroke:#244B5A;stroke-width:0.3764;" width="124.2871" x="452.4248" y="111.0838"/><line style="stroke:#244B5A;stroke-width:0.3764;" x1="452.4248" x2="576.7119" y1="139.6398" y2="139.6398"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="33.3251" x="459.9519" y="123.2315">Reposo</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="109.2329" x="459.9519" y="133.746">sin eventos en memoria</text></g><g id="ACUM"><rect fill="#F1F1F1" height="37.6356" rx="9.4089" ry="9.4089" style="stroke:#244B5A;stroke-width:0.3764;" width="158.1238" x="263.8856" y="237.4339"/><line style="stroke:#244B5A;stroke-width:0.3764;" x1="263.8856" x2="422.0094" y1="265.9899" y2="265.9899"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="95.2518" x="271.4127" y="249.5817">Acumulando eventos</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="143.0696" x="271.4127" y="260.0961">registro del detector (tope 100)</text></g><g id="ALERTA"><rect fill="#F1F1F1" height="37.6356" rx="9.4089" ry="9.4089" style="stroke:#244B5A;stroke-width:0.3764;" width="97.1939" x="294.3554" y="385.5525"/><line style="stroke:#244B5A;stroke-width:0.3764;" x1="294.3554" x2="391.5493" y1="414.1085" y2="414.1085"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="64.0922" x="301.8825" y="397.7003">Alerta emitida</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="82.1396" x="301.8825" y="408.2147">baja / media / alta</text></g><ellipse cx="514.5687" cy="57.6412" fill="#222222" rx="7.5271" ry="7.5271" style="stroke:#222222;stroke-width:0.7527;"/><g class="entity" data-entity="GMN2" data-source-line="25" data-uid="ent0003" id="entity_GMN2"><path d="M821.8481,205.1727 L821.8481,307.3298 L1095.4837,307.3298 L1095.4837,212.6998 L1087.9566,205.1727 L821.8481,205.1727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.3764;"/><path d="M1087.9566,205.1727 L1087.9566,212.6998 L1095.4837,212.6998 L1087.9566,205.1727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="217.7203" x="826.3644" y="217.3205">Por cada evento confirmado, en orden de &#237;ndice</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="222.2057" x="826.3644" y="227.8349">de log, se busca el evento LIBRE m&#225;s cercano en</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="240.9147" x="826.3644" y="238.3493">tiempo de cada OTRO detector dentro de 10 000 ms.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="241.5895" x="826.3644" y="248.8638">Si el grupo tiene 2 o m&#225;s detectores, se emite alerta;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="257.8287" x="826.3644" y="259.3782">el grupo se recorta a la ventana del evento m&#225;s antiguo.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="252.8802" x="826.3644" y="269.8927">Solo se aplican entradas CONFIRMADAS (commitIndex);</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="170.52" x="826.3644" y="280.4071">las de clase InicioTermino se ignoran.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="241.3293" x="826.3644" y="290.9215">Hora: t; si es 0, t_lider; si ambas son 0, no se agrupa.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="189.7583" x="826.3644" y="301.436">Sin NTP no hay alertas. (sismo.cpp:17-80)</text></g><g class="entity" data-entity="GMN5" data-source-line="37" data-uid="ent0006" id="entity_GMN5"><path d="M4.5163,374.322 L4.5163,434.4213 A0,0 0 0 0 4.5163,434.4213 L264.3826,434.4213 A0,0 0 0 0 264.3826,434.4213 L264.3826,407.3811 L294.265,404.3703 L264.3826,401.3594 L264.3826,381.8492 L256.8555,374.322 L4.5163,374.322 A0,0 0 0 0 4.5163,374.322" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.3764;"/><path d="M256.8555,374.322 L256.8555,381.8492 L264.3826,381.8492 L256.8555,374.322" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.3764;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="207.1927" x="9.0325" y="386.4698">Severidad por promedio de niveles del grupo:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="181.0698" x="9.0325" y="396.9842">&gt;= 7.5 alta &#183; &gt;= 4.5 media &#183; resto baja.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="210.7431" x="9.0325" y="407.4987">La alerta guarda: id = &#237;ndice de log del evento</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="244.0594" x="9.0325" y="418.0131">disparador, promedio, ids de eventos, t&#233;rmino y l&#237;der.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="154.6337" x="9.0325" y="428.5276">(sismo.cpp:11-15 &#183; sismo.h:11-17)</text></g><g class="entity" data-entity="GMN8" data-source-line="45" data-uid="ent0009" id="entity_GMN8"><path d="M580.7019,231.4574 L580.7019,281.0423 L791.6655,281.0423 L791.6655,238.9845 L784.1384,231.4574 L580.7019,231.4574" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.3764;"/><path d="M784.1384,231.4574 L784.1384,238.9845 L791.6655,238.9845 L784.1384,231.4574" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="195.1566" x="585.2182" y="243.6052">Nivel de simulaci&#243;n por duraci&#243;n del pulso:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="132.1626" x="585.2182" y="254.1196">nivel = min(10, 1 + ms/450);</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="130.1162" x="585.2182" y="264.634">pga = 0.028 * nivel + 0.015.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="135.616" x="585.2182" y="275.1485">No hay medici&#243;n s&#237;smica real.</text></g><!--link *start* to REPOSO--><g class="link" data-entity-1=".start." data-entity-2="REPOSO" data-source-line="18" data-uid="lnk3" id="link_.start._REPOSO"><path d="M514.5687,65.4318 C514.5687,75.9246 514.5687,91.4756 514.5687,106.2965" fill="none" id="*start*-to-REPOSO" style="stroke:#244B5A;stroke-width:0.7527;"/><polygon fill="#244B5A" points="514.5687,110.8128,517.5795,104.0384,514.5687,107.0492,511.5578,104.0384,514.5687,110.8128" style="stroke:#244B5A;stroke-width:0.7527;"/></g><!--link REPOSO to ACUM--><g class="link" data-entity-1="REPOSO" data-entity-2="ACUM" data-source-line="19" data-uid="lnk4" id="link_REPOSO_ACUM"><path d="M483.444,148.9602 C472.4168,155.712 460.0272,163.6004 449.0828,171.3007 C418.7861,192.6099 389.0653,216.6769 368.0044,234.2678" fill="none" id="REPOSO-to-ACUM" style="stroke:#244B5A;stroke-width:0.7527;"/><polygon fill="#244B5A" points="364.5382,237.1629,371.6677,235.1311,367.4267,234.7503,367.8075,230.5094,364.5382,237.1629" style="stroke:#244B5A;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="212.6395" x="449.8355" y="180.4376">primera entrada CONFIRMADA de clase Evento</text></g><!--link ACUM to ACUM--><g class="link" data-entity-1="ACUM" data-entity-2="ACUM" data-source-line="20" data-uid="lnk5" id="link_ACUM_ACUM"><path d="M422.1959,241.7996 C439.5233,243.1846 452.1237,248.002 452.1237,256.2517 C452.1237,264.4939 444.0252,268.9514 426.6978,270.3364" fill="none" id="ACUM-to-ACUM" style="stroke:#244B5A;stroke-width:0.7527;"/><polygon fill="#244B5A" points="422.1959,270.6962,429.1887,273.1578,425.9475,270.3964,428.7089,267.1552,422.1959,270.6962" style="stroke:#244B5A;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="106.1632" x="456.64" y="254.4743">evento sin coincidencia</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="89.9284" x="464.7574" y="264.9887">(sigue acumulando)</text></g><!--link ACUM to ALERTA--><g class="link" data-entity-1="ACUM" data-entity-2="ALERTA" data-source-line="21" data-uid="lnk6" id="link_ACUM_ALERTA"><path d="M307.3622,275.4308 C278.0065,293.2701 243.6527,321.9258 260.1522,351.7407 C268.161,366.2078 278.1508,374.9533 292.3168,382.9923" fill="none" id="ACUM-to-ALERTA" style="stroke:#244B5A;stroke-width:0.7527;"/><polygon fill="#244B5A" points="296.2447,385.2213,291.8389,379.2592,292.9714,383.3638,288.8669,384.4964,296.2447,385.2213" style="stroke:#244B5A;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="112.4833" x="266.3738" y="339.049">evento con coincidencia:</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="123.4212" x="260.9049" y="349.5634">2 o m&#225;s detectores en 10 s</text></g><!--reverse link ACUM to ALERTA--><g class="link" data-entity-1="ACUM" data-entity-2="ALERTA" data-source-line="22" data-uid="lnk8" id="link_ACUM_ALERTA"><path d="M361.4232,278.9216 C372.2623,292.8693 382.9721,309.4985 388.8658,329.9121 C391.553,339.2306 392.3057,342.663 388.8658,351.7407 C384.0033,364.5594 374.3686,376.249 365.178,385.274" fill="none" id="ACUM-backto-ALERTA" style="stroke:#244B5A;stroke-width:0.7527;"/><polygon fill="#244B5A" points="358.652,275.3555,360.4315,282.5521,360.9614,278.3272,365.1863,278.8571,358.652,275.3555" style="stroke:#244B5A;stroke-width:0.7527;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="120.9337" x="391.9218" y="339.049">alerta emitida; los eventos</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="9.0325" lengthAdjust="spacing" textLength="104.1256" x="400.3259" y="349.5634">usados no se reutilizan</text></g><!--link ACUM to GMN2--><g class="link" data-entity-1="ACUM" data-entity-2="GMN2" data-source-line="25" data-uid="lnk4" id="link_ACUM_GMN2"><path d="M386.1561,237.1328 C433.0199,217.5322 510.5567,188.3496 580.8073,176.946 C673.2704,161.9369 700.1873,156.3594 791.5665,176.946 C817.806,182.8548 844.7606,193.3852 869.1485,204.8791" fill="none" id="ACUM-GMN2" style="stroke:#244B5A;stroke-width:0.7527;stroke-dasharray:5.269,5.269;"/></g><!--link REPOSO to GMN8--><g class="link" data-entity-1="REPOSO" data-entity-2="GMN8" data-source-line="45" data-uid="lnk10" id="link_REPOSO_GMN8"><path d="M576.9233,140.5148 C613.3621,147.5225 654.6257,158.0379 667.3691,171.3007 C682.5739,187.1227 686.5331,212.4063 687.1504,231.1488" fill="none" id="REPOSO-GMN8" style="s