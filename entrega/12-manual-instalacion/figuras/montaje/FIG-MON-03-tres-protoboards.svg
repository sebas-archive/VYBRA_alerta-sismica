<text x="60" y="58" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="bold">Las tres protoboards: mismo montaje, distinta etiqueta</text>
<text x="60" y="96" font-size="18" fill="#444444" text-anchor="start">SIS-D1, SIS-D2 y SIS-D3 se arman con las mismas piezas y en las mismas posiciones. Solo cambia el firmware.</text>
