<circle cx="1415" cy="360" r="7" fill="#ffd23f" stroke="#333" stroke-width="2"/>
<circle cx="1475" cy="520" r="7" fill="#ffd23f" stroke="#333" stroke-width="2"/>
<text x="1430" y="552" font-size="13" fill="#1a1a1a" text-anchor="middle">pulsador</text>
<text x="1430" y="570" font-size="12" fill="#555555" text-anchor="middle">d24 / g26</text>
<path d="M1160 250 V228 H1415 V360" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1160 640 V688 H1475 V520" fill="none" stroke="#1565c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1315" y="728" font-size="15" fill="#37474f" text-anchor="middle">servidor preferido 3</text>
<text x="70" y="880" font-size="17" fill="#444444" text-anchor="start">El montaje físico es idéntico en las tres. La diferencia es la macro NODO con la que se compila cada placa (-DNODO=1, 2 o 3; firmware/cargar.sh:79).</text>
<text x="70" y="912" font-size="16" fill="#444444" text-anchor="start">La etiqueta de servidor preferido es una asignación operativa de la campaña: no es una constante del firmware.</text>
<text x="70" y="944" font-size="16" fill="#444444" text-anchor="start">El firmware replica los eventos por Raft entre los tres nodos (UDP 4210); el agregador consulta los tres y guarda en los servidores de datos.</text>
<text x="70" y="1000" font-size="16" fill="#444444" text-anchor="start">Etiqueta cada protoboard en el borde, junto al conector USB, y anota su MAC en firmware/placas.conf.</text>
</svg>
